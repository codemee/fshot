name: Package desktop apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or ref to package
        required: true
      release_tag:
        description: Existing GitHub Release tag to receive the files (defaults to ref)
        required: false
      attach_to_release:
        description: Attach artifacts to an existing matching GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: windows-x64
            path: dist/FShot-*-windows-x64.zip
          - runner: macos-15
            artifact: macos-arm64
            path: dist/FShot-*-macos-arm64.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out package source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Build desktop package
        run: uv run python scripts/build_app.py

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'release' || inputs.attach_to_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum FShot-* > SHA256SUMS.txt

      - name: Attach files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || inputs.ref }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "${{ github.repository }}"
